{% extends 'base.html' %}
{% block content %}
<main class="dark-theme">
  <section class="error-section d-flex align-items-center justify-content-center text-center">
    <div class="overlay"></div>
    <div class="container error-content">
      <h1 class="display-1 fw-bold text-danger mb-4 animate pop">500</h1>

      <div class="row justify-content-center text-center">
        <div class="col-md-8 animate fade-up">
          <h2 class="display-6 fw-semibold text-white mb-3">Internal Server Error</h2>
          <p class="lead text-white mb-4">
            Something went wrong on our end. We're working on fixing it.<br>
            <strong>Possible reasons:</strong> Database connection timeout, server overload, or temporary maintenance.
          </p>
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-center gap-3 animate fade-up delay-2 mt-4">
        <a href="{% url 'home' %}" class="btn btn-warning btn-lg text-dark fw-bold">Back to Home</a>
        <a href="{% url 'enquiry' %}" class="btn btn-outline-light btn-lg">Contact Support</a>
      </div>
    </div>
  </section>
</main>

<style>
  .dark-theme {
    background-color: #121212;
    color: #fff;
  }

  .error-section {
    height: 100vh;
    position: relative;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
  }

  .error-content {
    position: relative;
    z-index: 2;
  }

  .animate {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.8s ease forwards;
  }

  .delay-2 {
    animation-delay: 0.4s;
  }

  .pop {
    animation: popIn 0.8s ease-out forwards;
  }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes popIn {
    0% {
      opacity: 0;
      transform: scale(0.7);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  @media (max-width: 768px) {
    .display-1 {
      font-size: 4rem;
    }

    .display-6 {
      font-size: 1.3rem;
    }
  }
</style>
{% endblock %}
