{% extends 'base.html' %}
{% block content %}

<style>
  /* Page Styling */
  .notifications-container {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .notif-title {
		border-bottom: 2px solid #007bff;
		padding-bottom: 4px;
		font-weight: 600;
	}

	.list-group-item {
		transition: background 0.2s ease-in-out;
		font-size: 0.95rem;
		border-radius: 6px;
	}

  .bg-light {
      background-color: #e9ecef !important;
  }

  .markreadbtn {
      transition: all 0.3s ease-in-out;
  }

  .markreadbtn:hover {
      background-color: #0056b3 !important;
      color: #fff !important;
  }

  .bi-check2-circle {
      font-size: 1.2rem;
  }

  /* Loading Animation */
  .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50vh;
      flex-direction: column;
  }

  .loading-dots span {
      font-size: 1.5rem;
      font-weight: bold;
      color: #007bff;
      animation: loadingBlink 1.4s infinite;
  }

  .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
  }

  .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
  }

  @keyframes loadingBlink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
  }
  .sidebar-toggle-btn {
    background: linear-gradient(135deg, #007bff, #6610f2);
    border: none;
    color: white;
    border-radius: 8px;
  }
</style>

<main>
  <section class="container my-4">

    <!-- Mobile Sidebar Toggle -->
    <div class="d-md-none mb-3">
      <button class="btn sidebar-toggle-btn w-100 py-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#userMobileSidebar5">
        <i class="bi bi-list me-2"></i> Navigation Menu
      </button>
    </div>

    <!-- Offcanvas Sidebar (Mobile) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="userMobileSidebar5" aria-labelledby="userMobileSidebarLabel5">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="userMobileSidebarLabel5">My Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body p-0">
        {% include 'user/left-sidebar.html' %}
      </div>
    </div>

    <div class="row">
      <!-- Desktop Sidebar -->
      <div class="col-md-3 d-none d-md-block">
        {% include 'user/left-sidebar.html' %}
      </div>

      <!-- Notifications Section -->
      <div class="col-12 col-md-9">
        <div class="notifications-container">
          <h3 class="notif-title">
            Notifications <span class="badge bg-primary totalunread"></span>
          </h3>

          <span class="ajaxRes"></span>

          <ul class="list-group notif-list mt-3">
            <div class="loading-container">
              <div class="loading-dots">
                <span>.</span><span>.</span><span>.</span>
              </div>
              <p class="loading-text mt-2">Fetching Notifications...</p>
            </div>
          </ul>
        </div>
      </div>
    </div>
  </section>
</main>

<script type="text/javascript">
  $(document).ready(function(){
    $(".ajaxRes").hide();
    setInterval(function(){
      $.ajax({
        url: "{% url 'get_notifs' %}",
        dataType: 'json',
        beforeSend: function(){
          $(".ajaxRes").show().text('');
        },
        success: function(res){
          let _html = '';
          $(".totalunread").text(res.totalUnread);
          $.each(res.data, function(index, d){
            if (d.notifStatus == true) {
              _html += `
                <li class="list-group-item list${d.pk}">
                  ${d.notify_detail}
                  <button data-index="${d.pk}" data-notif="${d.pk}" class="btn btn-sm btn-secondary float-end markreadbtn markreadbtn${d.pk}" style="display:none;">
                    Mark Read
                  </button>
                  <button class="float-end btn btn-sm marked marked${d.pk}">
                    <i class="bi bi-check2-circle text-success fw-bolder"></i>
                  </button>
                </li>`;
            } else {
              _html += `
                <li class="list-group-item bg-light list${d.pk}">
                  ${d.notify_detail}
                  <button data-index="${d.pk}" data-notif="${d.pk}" class="btn btn-sm btn-secondary float-end markreadbtn markreadbtn${d.pk}">
                    Mark As Read
                  </button>
                  <button class="float-end btn btn-sm marked marked${d.pk}">
                  </button>
                </li>`;
            }
          });
          $(".notif-list").html(_html);
          $(".ajaxRes").hide();
        }
      });
    }, 5000);

    // Mark Read Functionality
    $(document).on("click", ".markreadbtn", function(){
      let _index = $(this).attr('data-index');
      let _notif = $(this).attr('data-notif');

      $.ajax({
        url: "{% url 'mark_read_notif' %}",
        data: { notif: _notif },
        dataType: 'json',
        success: function(res){
          if (res.bool == true) {
            $(".list" + _index).removeClass('bg-light');
            $(".markreadbtn" + _index).hide();
            $(".marked" + _index).show();
          }
        }
      });
    });
  });
</script>

{% endblock %}
